name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    # Label deines Forgejo-Runners anpassen (z. B. docker, ubuntu-latest)
    runs-on: docker
    container:
      image: gradle:8.9-jdk17
    steps:
      - name: Node für Actions installieren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs unzip curl ca-certificates

      - uses: actions/checkout@v4

      - name: Android SDK einrichten
        run: |
          export ANDROID_HOME=/opt/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK als Artefakt speichern
        uses: actions/upload-artifact@v3
        with:
          name: manhunt-apk
          path: app/build/outputs/apk/debug/app-debug.apk
