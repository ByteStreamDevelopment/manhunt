name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: gradle:8.9-jdk17
    steps:
      - name: Node 20, git und jq installieren
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip git jq
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: Android SDK einrichten
        run: |
          export ANDROID_HOME=/opt/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: APK als Artefakt speichern
        uses: actions/upload-artifact@v3
        with:
          name: manhunt-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release erstellen und APK anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          RELEASE_ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" | jq -r .id)
          curl -fsS -X POST "$API/releases/$RELEASE_ID/assets?name=manhunt-$TAG.apk" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@app/build/outputs/apk/debug/app-debug.apk"
