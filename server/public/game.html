<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manhunt</title>
  <meta name="theme-color" content="#14201a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Manhunt">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">Manhunt</a>
    <span class="title" id="gameName"></span>
    <span class="pill" id="roleChip" hidden></span>
    <span class="pill" id="statusPill" hidden></span>
  </header>
  <div id="banner" aria-live="assertive"></div>

  <main id="joinView" class="wrap" hidden></main>

  <div id="app" class="game-grid" hidden>
    <div class="mapwrap">
      <div id="map" role="application" aria-label="Karte"></div>
      <div class="mapbtns">
        <button class="btn small light" id="fitBtn">Alle zeigen</button>
        <button class="btn small light" id="meBtn">Ich</button>
      </div>
    </div>
    <div class="dock">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabbtn-lage" data-tab="lage" aria-selected="true">Lage</button>
        <button role="tab" id="tabbtn-actions" data-tab="actions" aria-selected="false">Aktionen</button>
        <button role="tab" id="tabbtn-players" data-tab="players" aria-selected="false">Spieler</button>
        <button role="tab" id="tabbtn-photos" data-tab="photos" aria-selected="false">Fotos</button>
        <button role="tab" id="tabbtn-chat" data-tab="chat" aria-selected="false">Chat</button>
      </div>
      <section id="tab-lage" role="tabpanel"></section>
      <section id="tab-actions" role="tabpanel" hidden></section>
      <section id="tab-players" role="tabpanel" hidden></section>
      <section id="tab-photos" role="tabpanel" hidden></section>
      <section id="tab-chat" role="tabpanel" hidden></section>
    </div>
  </div>

  <dialog id="lightbox">
    <img id="lbImg" alt="">
    <div id="lbReact"></div>
    <div class="row between"><span id="lbCap"></span><button class="btn small" id="lbClose">Schließen</button></div>
  </dialog>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <footer class="foot"><a href="/datenschutz">Datenschutz</a> · <a href="/impressum">Impressum</a></footer>
  <script src="/common.js"></script>
  <script src="/auth.js"></script>
  <script src="/game.js"></script>
</body>
</html>
