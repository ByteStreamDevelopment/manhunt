services:
  manhunt:
    build: .
    container_name: manhunt
    restart: unless-stopped
    # Alle Einstellungen aus der .env in den Container übernehmen (OPERATOR_*, USER_QUOTA_MB, PHOTO_RETENTION_DAYS, …)
    env_file:
      - .env
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Bitte ADMIN_PASSWORD in der .env setzen}
      # Optional: SHA-256-Fingerabdruck der Android-App (android/build.sh gibt ihn aus) für App-Links
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      # E-Mail-Versand für Bestätigungscodes (ohne SMTP_HOST stehen die Codes nur im Log)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # VPN-Erkennung per IP-Adresse: off | ipapi
      VPN_CHECK: ${VPN_CHECK:-off}
      # Accounts mit diesen Namen sind Admins
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-ProfImpossible,Mrcoolgamer11}
      TZ: Europe/Berlin
    volumes:
      - manhunt-data:/data
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: caddy   # <- Name des Docker-Netzwerks, in dem dein Caddy-Container hängt

volumes:
  manhunt-data:
